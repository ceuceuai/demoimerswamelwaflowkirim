<!DOCTYPE html>
<html lang="id">
<head>
  <!-- iMersWAMEL v8.7.0 - Maestro Frontend (Thick & Heavy Edition) -->
  <!-- Developer: Terry Katar | imersnesia.com -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>iMersWamel | Lead Capture</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Courier+Prime&family=Lora:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <!-- DYNAMIC TYPOGRAPHY ENGINE (Jantung Dinamis) -->
  <style id="dynamic-typography">
    #dynamicAppName { font-size: 38px; font-family: 'Poppins', sans-serif; color: #ffffff; text-transform: none !important; text-align: center !important; }
  </style>

  <style>
    body { font-family: 'Plus Jakarta Sans', 'Poppins', sans-serif; min-height: 100vh; min-height: -webkit-fill-available; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 50px 16px; opacity: 0; transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1), background-color 0.6s ease; overflow-x: hidden; overflow-y: auto; text-transform: none !important; }
    html { height: -webkit-fill-available; }
    
    /* THEME ENGINE - PREMIUM DEPTH */
    .theme-midnight { background-color: #0f172a; color: white; }
    .theme-midnight .glass { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.05); box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.5); backdrop-filter: blur(20px); }
    .theme-midnight .input-control { background: #0f172a; color: white; border: 1px solid rgba(255, 255, 255, 0.1); }

    .theme-clean { background-color: #f8fafc; color: #0f172a; }
    .theme-clean .glass { background: white; border: 1px solid #e2e8f0; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.05); }
    .theme-clean .input-control { background: #f1f5f9; color: #0f172a; border: 1px solid #e2e8f0; }

    .theme-nature { background-color: #022c22; color: white; }
    .theme-nature .glass { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); backdrop-filter: blur(30px); }

    #mainWrapper { width: 100%; display: flex; flex-direction: column; transition: all 0.7s cubic-bezier(0.4, 0, 0.2, 1); max-width: 100%; margin-top: 1rem; }
    #productImageWrapper { max-width: 440px; width: 100%; margin: 1.5rem auto; border-radius: 1.8rem; overflow: hidden; box-shadow: 0 25px 60px rgba(0,0,0,0.4); }
    #productImage { width: 100%; height: auto; display: block; object-fit: contain; }

    .layout-center { align-items: center; text-align: center; }
    .layout-center #contentSide { margin-bottom: 2.5rem; width: 100%; max-width: 650px; }
    .layout-center .glass { max-width: 440px; width: 100%; margin: 0 auto; }

    @media (min-width: 768px) {
      .layout-split { flex-direction: row !important; justify-content: center !important; align-items: center !important; gap: 60px !important; max-width: 1100px !important; margin: 4rem auto !important; text-align: left !important; }
      .layout-split #contentSide { width: 440px !important; text-align: center !important; display: flex !important; flex-direction: column !important; align-items: center !important; flex-shrink: 0 !important; }
      .layout-split #formSide { width: 440px !important; flex-shrink: 0 !important; }
    }

    .glass { border-radius: 2rem; padding: 2.5rem; position: relative; z-index: 10; }
    .input-control { width: 100%; padding: 1rem 1.25rem; border-radius: 0.9rem; margin-top: 0.4rem; outline: none; transition: 0.3s; font-size: 15px; font-weight: 500; }
    .input-control:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.15); }

    .btn-cta { transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); cursor: pointer; font-weight: 800; color: white; letter-spacing: 0.05em; padding-top: 1.4rem !important; padding-bottom: 1.4rem !important; display: block; width: 100%; text-align: center; border-radius: 1.1rem; border: none; text-transform: uppercase; }
    .btn-cta:hover { transform: translateY(-4px); filter: brightness(1.1); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }

    #protectedFooter { margin-top: 6rem; padding-bottom: 4rem; text-align: center; width: 100%; z-index: 5; }
    .brand-copyright { opacity: 0.3; font-weight: 600; letter-spacing: 0.1em; font-size: 10px; color: #94a3b8; text-transform: uppercase; }
    
    #loader-overlay { position: fixed; inset: 0; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 9999; transition: opacity 0.8s ease; }
    @keyframes fadeInSlide { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-in { animation: fadeInSlide 1s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  </style>
</head>
<body class="theme-midnight">

  <div id="loader-overlay">
    <div class="flex flex-col items-center gap-6">
      <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin"></div>
      <p class="text-[11px] font-black text-indigo-400 uppercase tracking-[0.4em] animate-pulse">Maestro Handshaking...</p>
    </div>
  </div>

  <div id="mainWrapper" class="layout-center animate-in">
    <div id="contentSide" class="z-20 px-4 md:px-0">
      <div id="logoWrapper" class="hidden mb-8 md:mb-12">
        <img id="dynamicLogo" src="" alt="" class="h-14 md:h-20 w-auto mx-auto object-contain">
      </div>
      
      <h1 id="dynamicAppName" class="font-black tracking-tighter mb-4 leading-tight"></h1>
      <p id="dynamicTagline" class="text-[16px] md:text-xl font-medium opacity-80 leading-relaxed mx-auto max-w-md md:max-w-2xl mb-6 px-4"></p>
      
      <div id="productImageWrapper" class="hidden transform transition-all duration-1000 scale-95 opacity-0">
        <img id="productImage" src="" alt="">
      </div>
    </div>

    <div id="formSide" class="w-full flex justify-center z-20 mt-8 md:mt-0 px-4">
      <main class="glass w-full shadow-2xl">
        <div id="formWrapper">
          <div class="text-center mb-10">
            <h2 id="dynamicFormHeading" class="text-[19px] md:text-2xl font-black tracking-widest uppercase"></h2>
            <div id="formIndicator" class="w-12 h-1 bg-indigo-500 mx-auto mt-5 rounded-full opacity-60"></div>
          </div>
          <form id="leadForm" onsubmit="handleSubmit(event)" class="space-y-5 md:space-y-6 text-left">
            <input type="hidden" id="campaignInput" name="campaign" value="GENERAL">
            <div>
              <label class="text-[11px] font-black text-indigo-400 uppercase tracking-widest ml-1">Nama Lengkap</label>
              <input type="text" name="nama" id="nama" required placeholder="Siapa nama Anda?" class="input-control font-bold">
            </div>
            <div>
              <label class="text-[11px] font-black text-indigo-400 uppercase tracking-widest ml-1">Email Aktif</label>
              <input type="email" name="email" id="email" required placeholder="nama@perusahaan.com" class="input-control font-bold">
            </div>
            <div>
              <label class="text-[11px] font-black text-indigo-400 uppercase tracking-widest ml-1">Nomor WhatsApp</label>
              <input type="tel" name="wa" id="wa" required placeholder="628xxxxxxxxxx" class="input-control font-bold">
            </div>
            <button type="submit" id="submitBtn" class="btn-cta text-[18px] md:text-[20px] mt-8 active:scale-95 shadow-xl"></button>
            <div class="flex items-center justify-center gap-3 mt-10 opacity-30">
              <i data-lucide="shield-check" class="w-4 h-4 text-indigo-400"></i>
              <p class="text-[10px] font-black tracking-[0.2em] uppercase">AES-256 Leads Encrypted</p>
            </div>
          </form>
        </div>
        <div id="successState" class="hidden text-center py-16 md:py-20 animate-in px-6">
          <div class="w-24 h-24 bg-emerald-500/10 rounded-full flex items-center justify-center mx-auto mb-10 border border-emerald-500/20 shadow-2xl">
            <i data-lucide="check-circle" class="w-12 h-12 text-emerald-400"></i>
          </div>
          <h2 class="text-4xl md:text-5xl font-black mb-4 uppercase tracking-tighter text-emerald-500">BERHASIL!</h2>
          <p id="successMsg" class="opacity-80 text-[17px] md:text-[20px] leading-relaxed mb-10 font-bold"></p>
        </div>
      </main>
    </div>
  </div>

  <footer id="protectedFooter">
    <p class="brand-copyright">
      &copy; 2026 <a id="footerBrandLink" href="#" target="_blank"><span id="footerBrandName">iMersWamel Pro</span></a>. All Rights Reserved.
    </p>
  </footer>

  <script>
    /**
     * PENTING: Ganti URL di bawah dengan Link Web App lu yang paling BARU.
     * Pastikan lu pilih "Anyone" pas deploy.
     */
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyrlNIIwfixBrWQdqMGwBt8E56j_y19h1KsASA2q1uvFxA7lFaWEP-4PnGAIAiKTXIL/exec"; 
    
    // MAESTRO PATH DETECTION: Mendukung link /kampen (Clean URL Vercel)
    function detectCampaignId() {
      const urlParams = new URLSearchParams(window.location.search);
      let id = urlParams.get('campaign');
      if (!id) {
        const pathSegments = window.location.pathname.split('/').filter(s => s && s !== "index.html");
        id = pathSegments.length > 0 ? pathSegments[pathSegments.length - 1] : "GENERAL";
      }
      return id || "GENERAL";
    }

    const currentCampaign = detectCampaignId();
    let siteSettings = {};

    async function initializeMaestro() {
      console.log("iMersWamel: Memulai Sinkronisasi untuk Campaign:", currentCampaign);
      try {
        const response = await fetch(`${WEB_APP_URL}?action=getSettings&campaign=${currentCampaign}&_t=${Date.now()}`);
        const data = await response.json();
        siteSettings = data;
        
        console.log("iMersWamel: Data Berhasil Ditarik:", data);

        // 1. TEMA VISUAL
        document.body.className = `theme-${data.theme || 'midnight'}`;
        
        // 2. TYPOGRAPHY ENGINE (FIXED: Nular ke semua branding)
        const styleTag = document.getElementById('dynamic-typography');
        let fRaw = data.titleFontFamily || data.globalFontFamily || 'Poppins';
        let fSize = parseInt(data.titleFontSize || data.globalFontSize || '38');
        let fFam = fRaw === 'serif' ? 'Lora, serif' : (fRaw === 'monospace' ? 'Courier Prime, monospace' : 'Poppins, sans-serif');
        
        let colorCSS = "", btnCSS = "", indicatorCSS = "";
        const cType = data.titleColorType || data.globalColorType || 'solid';
        
        if (cType === 'gradient') {
          let gS = data.titleGradientStart || data.globalGradientStart || '#6366f1';
          let gE = data.titleGradientEnd || data.globalGradientEnd || '#a855f7';
          colorCSS = `background: linear-gradient(to right, ${gS}, ${gE}) !important; -webkit-background-clip: text !important; -webkit-text-fill-color: transparent !important; background-clip: text !important; color: transparent !important;`;
          btnCSS = `background: linear-gradient(135deg, ${gS} 0%, ${gE} 100%) !important; box-shadow: 0 10px 30px -5px ${gS}88 !important;`;
          indicatorCSS = `background: ${gS} !important;`;
        } else {
          let sC = data.titleColorSolid || data.globalColorSolid || '#ffffff';
          colorCSS = `color: ${sC} !important; background: none !important; -webkit-text-fill-color: initial !important;`;
          btnCSS = `background-color: ${sC} !important; box-shadow: 0 10px 30px -5px ${sC}88 !important;`;
          indicatorCSS = `background-color: ${sC} !important;`;
        }

        styleTag.innerHTML = `
          #dynamicAppName { font-size: ${fSize}px !important; font-family: ${fFam} !important; ${colorCSS} text-align: center !important; }
          #dynamicTagline, #dynamicFormHeading { font-family: ${fFam} !important; ${colorCSS} }
          #formIndicator { ${indicatorCSS} }
          .btn-cta { ${btnCSS} }
          @media (max-width: 640px) { #dynamicAppName { font-size: ${Math.max(26, fSize * 0.75)}px !important; } }
        `;

        // 3. LAYOUT & PRODUCT IMAGE SYNC
        const wrapper = document.getElementById('mainWrapper');
        wrapper.className = (data.layout === 'split') ? "layout-split animate-in" : "layout-center animate-in";
        
        const campImg = data.productImageUrl;
        const masterImg = data.masterProductImageUrl;
        const finalImg = (campImg && campImg.trim() !== "") ? campImg : masterImg;
        
        const showCamp = String(data.showProductImg).toLowerCase() === "true";
        const showMaster = String(data.masterShowProductImg).toLowerCase() === "true";
        const isShow = (data.showProductImg !== undefined) ? showCamp : showMaster;

        if (isShow && finalImg) {
          document.getElementById('productImage').src = finalImg;
          const pWrap = document.getElementById('productImageWrapper');
          pWrap.classList.remove('hidden');
          setTimeout(() => { pWrap.classList.add('scale-100', 'opacity-100'); }, 300);
        }

        // 4. CONTENT MAPPING
        document.title = data.appName || "iMersWamel";
        document.getElementById('dynamicAppName').innerText = data.appName || "iMersWamel Pro";
        document.getElementById('dynamicTagline').innerText = data.tagline || "Build Simple. Look Serious";
        document.getElementById('dynamicFormHeading').innerText = data.formHeading || "Daftar Sekarang";
        document.getElementById('submitBtn').innerText = data.btnText || "Dapatkan Akses";
        document.getElementById('successMsg').innerText = "Data pendaftaran Anda sudah kami amankan. Harap tunggu pesan instruksi melalui WhatsApp.";
        document.getElementById('campaignInput').value = currentCampaign;
        
        // FOOTER & LOGO
        if (data.appName) document.getElementById('footerBrandName').innerText = data.appName;
        document.getElementById('footerBrandLink').href = data.websiteUrl || "#";

        if (data.logoUrl) {
          const lImg = document.getElementById('dynamicLogo');
          lImg.src = data.logoUrl;
          document.getElementById('logoWrapper').classList.remove('hidden');
        }

        // REMOVE LOADER
        const loader = document.getElementById('loader-overlay');
        loader.style.opacity = '0';
        setTimeout(() => { loader.remove(); document.body.style.opacity = '1'; lucide.createIcons(); }, 700);

      } catch (err) { 
        console.error("iMersWamel CRITICAL ERROR:", err);
        document.getElementById('loader-overlay').remove();
        document.body.style.opacity = '1';
      }
    }

    async function handleSubmit(event) {
      event.preventDefault();
      const btn = document.getElementById('submitBtn');
      const originalText = btn.innerText;
      btn.innerText = "⏳ SEDANG MENGIRIM..."; btn.disabled = true;
      
      const payload = Object.fromEntries(new FormData(event.target).entries());
      try {
        await fetch(WEB_APP_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        document.getElementById('formWrapper').style.opacity = '0';
        setTimeout(() => {
          document.getElementById('formWrapper').classList.add('hidden');
          document.getElementById('successState').classList.remove('hidden');
          lucide.createIcons();
        }, 450);
        
        // DYNAMIC REDIRECT (Mapping redirectUrl vs redirect)
        const targetUrl = siteSettings.redirectUrl || siteSettings.redirect;
        if (targetUrl) {
          setTimeout(() => { window.location.href = targetUrl; }, 4000);
        }
      } catch (e) { 
        btn.disabled = false; btn.innerText = "COBA LAGI"; 
        console.error("Submit Fail:", e);
      }
    }

    document.addEventListener('DOMContentLoaded', initializeMaestro);
  </script>
</body>
</html>
